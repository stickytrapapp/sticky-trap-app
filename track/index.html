<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0A0F">
<title>Order tracker · The Sticky Trap</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root{--ink:#0A0A0F;--panel:#131019;--panel-2:#1b1726;--line:#2a2438;--paper:#F5F3FA;--muted:#b3adc6;--mag:#FF1FA2;--pur:#8A2BE2;--cy:#12C4FF;--good:#25E0A6;--grad:linear-gradient(100deg,#FF1FA2 0%,#8A2BE2 52%,#12C4FF 100%)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 60px}
  .logo{display:block;max-width:200px;margin:0 auto 16px}
  h1{font-size:13px;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--muted);margin:0 0 6px;font-weight:800}
  .code{text-align:center;font-size:30px;font-weight:900;margin:0;letter-spacing:.02em}
  .who{text-align:center;color:var(--muted);margin:4px 0 20px;font-size:14px}
  .now{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .now .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);font-weight:800}
  .now .v{font-size:22px;font-weight:900;margin:4px 0 6px}
  .now .m{color:var(--muted);font-size:14px;line-height:1.5}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .meta div{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .meta .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .meta .v{font-size:14px;font-weight:700;margin-top:3px;line-height:1.4}
  .tl{list-style:none;margin:0;padding:0 0 0 6px;position:relative}
  .tl::before{content:"";position:absolute;left:13px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .tl li{position:relative;padding:0 0 18px 32px;color:var(--muted);font-size:14px}
  .tl li::before{content:"";position:absolute;left:6px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--panel-2);border:2px solid var(--line)}
  .tl li.done{color:var(--paper)} .tl li.done::before{background:var(--good);border-color:var(--good)}
  .tl li.cur{color:#fff;font-weight:800} .tl li.cur::before{background:var(--grad);border-color:transparent;box-shadow:0 0 0 4px rgba(255,31,162,.25)}
  .tl li small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
  .btn{display:block;width:100%;margin-top:6px;background:var(--grad);color:#0A0A0F;border:0;border-radius:28px;padding:16px 20px;font:inherit;font-size:16px;font-weight:900;cursor:pointer;text-align:center;text-decoration:none}
  .btn[disabled]{opacity:.55}
  .note{color:var(--muted);font-size:12.5px;text-align:center;margin-top:12px;line-height:1.5}
  .foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:28px;line-height:1.6}
  .foot a{color:var(--cy);text-decoration:none;font-weight:700}
  .err{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);line-height:1.6}
  .lookup input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:#fff;font:inherit;font-size:15px;padding:11px 12px;margin-top:8px;outline:none}
  .lookup input:focus{border-color:var(--cy)}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/img/logo.png" alt="The Sticky Trap">
  <h1>Order tracker</h1>
  <div id="app"><div class="err">Loading your order…</div></div>
  <div class="foot">Questions? Call or text <a href="sms:+17344603845">734 460 3845</a> · <a href="mailto:thestickytrap@gmail.com">thestickytrap@gmail.com</a><br>FM Holdings LLC · d/b/a The Sticky Trap · 4750 Venture Dr, Suite 101, Ann Arbor, MI 48108</div>
</div>
<script>
(function(){
  var API='https://script.google.com/macros/s/AKfycbzgctrnkyWjVnhzioE_B4x8J2pyi4WzRSJG2e00Y_Y5cz0vQx-q5jhvOhMWg2x-K9ciFw/exec';
  var q=function(k){ var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)')); return m?decodeURIComponent(m[1].replace(/\+/g,' ')):''; };
  var app=document.getElementById('app');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function when(ts){ if(!ts) return ''; var d=new Date(ts); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
  function lookupForm(msg){
    app.innerHTML='<div class="err lookup">'+esc(msg||'Enter your order code and the email on the order.')+
      '<input id="lo" placeholder="Order code, e.g. ST-K3F9 or 222-YO" value="'+esc(q('o'))+'"><input id="le" type="email" placeholder="Email on the order" value="'+esc(q('e'))+'">'+
      '<button class="btn" id="lb" style="margin-top:12px">Find my order</button></div>';
    document.getElementById('lb').addEventListener('click',function(){ var o=document.getElementById('lo').value.trim(), e=document.getElementById('le').value.trim(); if(!o||!e) return; location.search='?o='+encodeURIComponent(o)+'&e='+encodeURIComponent(e); });
  }
  function render(o){
    var cur=o.stage, idx=o.stages.map(function(s){return s.key;}).indexOf(cur);
    var hist={}; (o.history||[]).forEach(function(h){ hist[h.stage]=h; });
    var tl=o.stages.map(function(s,i){ var cls=i<idx?'done':(i===idx?'cur':''); var h=hist[s.key]; return '<li class="'+cls+'">'+esc(s.label)+(h?'<small>'+esc(when(h.ts))+(h.note?' · '+esc(h.note):'')+'</small>':'')+'</li>'; }).join('');
    app.innerHTML='<p class="code">'+esc(o.code)+'</p><div class="who">'+esc(o.company||o.name||'')+'</div>'+
      '<div class="now"><div class="k">Right now</div><div class="v">'+esc(o.label)+'</div><div class="m">'+esc(o.message||'')+'</div></div>'+
      '<div class="meta"><div><div class="k">Due</div><div class="v">'+esc(o.due||'To be set')+'</div></div><div><div class="k">Order</div><div class="v">'+esc(o.items||'See your quote')+'</div></div></div>'+
      (o.can_approve?'<button class="btn" id="approve">✓ Approve my proof</button><div class="note">Approving tells us the proof is right and we can print. If something needs a change, reply to the proof email instead.</div>':'')+
      '<ul class="tl" style="margin-top:18px">'+tl+'</ul>';
    var ab=document.getElementById('approve');
    if(ab) ab.addEventListener('click',function(){ ab.disabled=true; ab.textContent='Sending…';
      fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'approve',code:o.code,token:o.token})}).then(function(r){return r.json();})
        .then(function(j){ if(j&&j.ok){ load(); } else { ab.disabled=false; ab.textContent='✓ Approve my proof'; alert('Could not record the approval - try again or text 734 460 3845.'); } })
        .catch(function(){ ab.disabled=false; ab.textContent='✓ Approve my proof'; }); });
  }
  function load(){
    var o=q('o'), t=q('t'), e=q('e'); if(!o||(!t&&!e)) return lookupForm();
    fetch(API+'?action=track&o='+encodeURIComponent(o)+'&t='+encodeURIComponent(t)+'&e='+encodeURIComponent(e)+'&_='+Date.now()).then(function(r){return r.json();})
      .then(function(j){ if(j&&j.ok&&j.order) render(j.order); else lookupForm(j&&j.error==='not_found'?'We could not find that order. Check the code and the email, or text us.':'Could not load the order right now. Check the code and email, or text us.'); })
      .catch(function(){ lookupForm('Could not reach the tracker right now. Try again in a moment.'); });
  }
  load();
})();
</script>
</body>
</html>
