<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Order tracker · The Sticky Trap</title>
<link rel="icon" href="/icons/track-192.png">
<link rel="apple-touch-icon" href="/icons/track-apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="My order">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{--ink:#000;--panel:#0e0e0e;--panel-2:#171717;--line:#262626;--paper:#fff;--muted:#fff;--mag:#FF1FA2;--pur:#8A2BE2;--cy:#12C4FF;--good:#25E0A6;--grad:linear-gradient(100deg,#FF1FA2 0%,#8A2BE2 52%,#12C4FF 100%)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 60px}
  .logo{display:block;max-width:200px;margin:0 auto 16px}
  h1{font-size:13px;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--muted);margin:0 0 6px;font-weight:800}
  .code{text-align:center;font-size:30px;font-weight:900;margin:0;letter-spacing:.02em}
  .who{text-align:center;color:var(--muted);margin:4px 0 20px;font-size:14px}
  .now{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .now .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);font-weight:800}
  .now .v{font-size:22px;font-weight:900;margin:4px 0 6px}
  .now .m{color:var(--muted);font-size:14px;line-height:1.5}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .meta div{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .meta .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .meta .v{font-size:14px;font-weight:700;margin-top:3px;line-height:1.4}
  .tl{list-style:none;margin:0;padding:0 0 0 6px;position:relative}
  .tl::before{content:"";position:absolute;left:13px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .tl li{position:relative;padding:0 0 18px 32px;color:var(--muted);font-size:14px}
  .tl li::before{content:"";position:absolute;left:6px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--panel-2);border:2px solid var(--line)}
  .tl li.done{color:var(--paper)} .tl li.done::before{background:var(--good);border-color:var(--good)}
  .tl li.cur{color:#fff;font-weight:800} .tl li.cur::before{background:var(--grad);border-color:transparent;box-shadow:0 0 0 4px rgba(255,31,162,.25)}
  .tl li small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
  .btn{display:block;width:100%;margin-top:6px;background:var(--grad);color:#0A0A0F;border:0;border-radius:28px;padding:16px 20px;font:inherit;font-size:16px;font-weight:900;cursor:pointer;text-align:center;text-decoration:none}
  .btn[disabled]{opacity:.55}
  .note{color:var(--muted);font-size:12.5px;text-align:center;margin-top:12px;line-height:1.5}
  .lookup .lk-h{font-size:18px;font-weight:800;color:#fff;margin-bottom:10px}.lookup .lk-or{color:var(--muted);font-size:12px;margin:16px 0 6px;letter-spacing:.08em;text-transform:uppercase}
  .lookup input{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;color:#fff;font:inherit;font-size:17px;margin-top:8px}
  .lst{padding:18px 16px}.lst .lk-h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px}
  .lst-o{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}.lst-t{display:flex;align-items:baseline;gap:10px}.lst-t b{font-size:16px;color:#fff}.lst-t span{color:var(--muted);font-size:13px}
  .lst-s{margin-top:4px;font-weight:800;color:var(--cy)}.lst-i{margin-top:3px;color:var(--muted);font-size:13px}.lst .note{margin-top:14px;color:var(--muted);font-size:12.5px;line-height:1.45}
  .save{margin-top:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .save .sh{display:flex;align-items:center;gap:10px}.save .sh b{flex:1;font-size:14px;color:#fff}.save .sx{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px;cursor:pointer}
  .save ol{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:13px;line-height:1.5}.save ol b{color:#fff}
  .save .sbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.save .sbtns .btn{width:auto;margin:0;padding:11px 16px;font-size:14px}
  .prefs{margin-top:16px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .prefs .pl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;flex:1 1 100%}
  .prefs label{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:#fff;cursor:pointer}.prefs label.off{opacity:.5}
  .prefs input{accent-color:var(--cy);width:18px;height:18px;margin:0}.prefs small{flex:1 1 100%;color:var(--muted);font-size:11.5px;line-height:1.4}
  .prefs .chan{flex:1 1 100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:#fff}.prefs .chan b{font-weight:800}.prefs .chan span{color:var(--muted)}
  .prefs .chan small{flex:1 1 100%;margin-top:-2px}.prefs .lnk{margin-left:auto;background:none;border:0;color:var(--cy);font:inherit;font-weight:800;font-size:13px;cursor:pointer;padding:2px 0}
  .prefs .phbox{flex:1 1 100%;display:flex;gap:8px;align-items:center}.prefs .phbox input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;color:#fff;font:inherit;font-size:16px}
  .prefs .btn.small{width:auto;margin:0;padding:12px 18px;font-size:14px}
  .rate{margin-top:16px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;text-align:center}
  .rate .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:8px}
  .rate .tb{display:flex;gap:10px}.rate .tbtn{flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:#fff;font:inherit;font-size:15px;font-weight:800;cursor:pointer}.rate .tbtn.on{border-color:var(--cy);background:rgba(18,196,255,.14)}
  .rate textarea{width:100%;margin-top:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:#fff;font:inherit;font-size:14px;padding:10px 12px;outline:none;resize:vertical}
  .rate .thanks{font-size:15px;font-weight:800;color:#fff}.rate small{display:block;margin-top:8px;color:var(--muted);font-size:12px}
  .pushrow{flex:1 1 100%;display:flex;align-items:center;gap:10px;padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
  .pushrow .pt{flex:1;min-width:0}.pushrow .pt b{display:block;font-size:14px;color:#fff}.pushrow .pt small{display:block;flex:none;margin-top:2px}
  .sw{position:relative;width:46px;height:26px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
  .sw.on{background:var(--cy);border-color:var(--cy)}.sw.on::after{transform:translateX(20px)}.sw[disabled]{opacity:.45;cursor:default}
  .foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:28px;line-height:1.6}
  .foot a{color:var(--cy);text-decoration:none;font-weight:700}
  .err{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);line-height:1.6}
  .lookup input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:#fff;font:inherit;font-size:15px;padding:11px 12px;margin-top:8px;outline:none}
  .lookup input:focus{border-color:var(--cy)}
  .btn.ghost{background:rgba(255,255,255,.06);color:var(--paper);border:1px solid var(--line)}
  textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:#fff;font:inherit;font-size:15px;padding:10px 11px;outline:none}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/img/logo.png" alt="The Sticky Trap">
  <h1>Order tracker</h1>
  <div id="app"><div class="err">Loading your order…</div></div>
  <div class="foot">Questions? Call or text <a href="sms:+17344603845">734 460 3845</a> · <a href="mailto:thestickytrap@gmail.com">thestickytrap@gmail.com</a><br>FM Holdings LLC · d/b/a The Sticky Trap · 4750 Venture Dr, Suite 101, Ann Arbor, MI 48108</div>
</div>
<script src="/push.js"></script>
<script>
(function(){
  var API='https://script.google.com/macros/s/AKfycbzgctrnkyWjVnhzioE_B4x8J2pyi4WzRSJG2e00Y_Y5cz0vQx-q5jhvOhMWg2x-K9ciFw/exec';
  var q=function(k){ var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)')); return m?decodeURIComponent(m[1].replace(/\+/g,' ')):''; };
  var app=document.getElementById('app');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function when(ts){ if(!ts) return ''; var d=new Date(ts); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
  // 2026-09-18 (Shane): phone first - 'type your number, see your orders'. Read-only: approving a proof or paying still needs the link
  // from the email or the QR on the invoice. Order code + email stays as the second way in.
  function saved(code){ try{ return localStorage.getItem('st_track_saved_'+code)==='1'; }catch(e){ return false; } }
  function saveSteps(){ var ua=navigator.userAgent||'', ios=/iPhone|iPad|iPod/.test(ua), android=/Android/.test(ua);
    if(ios) return '<li>Tap the <b>Share</b> button at the bottom of Safari (the square with the arrow).</li><li>Scroll and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Your order lives on your home screen as <b>My order</b> - tap it any time.</li>';
    if(android) return '<li>Tap the <b>&#8942;</b> menu at the top right of Chrome.</li><li>Tap <b>Add to Home screen</b>, then <b>Add</b>.</li><li>Your order lives on your home screen - tap it any time.</li>';
    return '<li>Bookmark this page (Ctrl/Cmd + D), or drag the address to your desktop.</li><li>The link is yours for this order - it never expires.</li>'; }
  function lookupForm(msg){
    app.innerHTML='<div class="err lookup"><div class="lk-h">'+esc(msg||'Find your orders')+'</div>'+
      '<input id="lp" type="tel" inputmode="tel" autocomplete="tel" placeholder="Your cell number" value="'+esc(q('p'))+'">'+
      '<button class="btn" id="lpb" style="margin-top:10px">Show my orders</button>'+
      '<div class="lk-or">or the order code + the email on it</div>'+
      '<input id="lo" placeholder="Order code, e.g. ST-K3F9 or 222-YO" value="'+esc(q('o'))+'"><input id="le" type="email" placeholder="Email on the order" value="'+esc(q('e'))+'">'+
      '<button class="btn ghost" id="lb" style="margin-top:10px">Find that order</button></div>';
    var lp=document.getElementById('lp');
    lp.addEventListener('input',function(){ var d=lp.value.replace(/\D/g,'').slice(0,11); if(d.length===11&&d[0]==='1') d=d.slice(1); lp.value=d.length>6?d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6):d.length>3?d.slice(0,3)+'-'+d.slice(3):d; });
    document.getElementById('lpb').addEventListener('click',function(){ var d=lp.value.replace(/\D/g,''); if(d.length<10){ lp.focus(); return; } location.search='?p='+encodeURIComponent(d); });
    lp.addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('lpb').click(); });
    document.getElementById('lb').addEventListener('click',function(){ var o=document.getElementById('lo').value.trim(), e=document.getElementById('le').value.trim(); if(!o||!e) return; location.search='?o='+encodeURIComponent(o)+'&e='+encodeURIComponent(e); });
  }
  function renderList(j){   // phone lookup: one card per order, read-only
    var os=j.orders||[]; var h='<div class="lst"><div class="lk-h">Orders on &hellip;'+esc(j.phone_last4||'')+'</div>';
    // 2026-09-18 (foreman note 1): a phone number is not a secret - the list shows code, stage and due date only; the real link is EMAILED to the address on file.
    os.forEach(function(o){ h+='<div class="lst-o"><div class="lst-t"><b>'+esc(o.code)+'</b></div>'+
      '<div class="lst-s">'+esc(o.label||'')+(o.due?' &middot; due '+esc(o.due):'')+'</div></div>'; });
    var anyEmail=os.some(function(o){ return o.has_email; });
    h+=(anyEmail?'<button class="btn" id="llink" style="margin-top:6px">Email me my order link</button><div class="note" id="llnote">Your full order page - proof, approval, payment - goes to the email on the order. Never shown here.</div>'
                :'<div class="note">No email on this order yet - text us and we will send your link.</div>')+
       '<button class="btn ghost" id="lagain" style="margin-top:12px">Look up another number</button></div>';
    app.innerHTML=h; document.getElementById('lagain').addEventListener('click',function(){ location.search=''; });
    var ll=document.getElementById('llink'); if(ll) ll.addEventListener('click',function(){ ll.disabled=true; var nt=document.getElementById('llnote'); nt.textContent='Sending…';
      fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'track_link',p:q('p')})}).then(function(r){return r.json();})
        .then(function(j){ if(j&&j.ok){ nt.textContent='Sent to '+(j.to_hint||'your email')+' - check your inbox.'; ll.textContent='Sent'; } else { ll.disabled=false; nt.textContent=j&&j.error==='rate_limited'?'Already sent a moment ago - check your inbox.':'Could not send that - text us and we will send your link.'; } })
        .catch(function(){ ll.disabled=false; nt.textContent='Could not reach us - try again.'; }); });
  }
  function render(o){
    var cur=o.stage, idx=o.stages.map(function(s){return s.key;}).indexOf(cur);
    var hist={}; (o.history||[]).forEach(function(h){ hist[h.stage]=h; });
    var tl=o.stages.map(function(s,i){ var cls=i<idx?'done':(i===idx?'cur':''); var h=hist[s.key]; return '<li class="'+cls+'">'+esc(s.label)+(h?'<small>'+esc(when(h.ts))+(h.note?' · '+esc(h.note):'')+'</small>':'')+'</li>'; }).join('');
    app.innerHTML='<p class="code">'+esc(o.code)+'</p><div class="who">'+esc(o.company||o.name||'')+'</div>'+
      '<div class="now"><div class="k">Right now</div><div class="v">'+esc(o.label)+'</div><div class="m">'+esc(o.message||'')+'</div></div>'+
      (o.token&&!saved(o.code)?'<div class="save" id="save"><div class="sh"><b>Keep this on your phone</b><button type="button" class="sx" id="savex" aria-label="Dismiss">&times;</button></div>'+
        '<ol>'+saveSteps()+'</ol><div class="sbtns"><button type="button" class="btn ghost" id="savecopy">Copy my link</button>'+(navigator.share?'<button type="button" class="btn ghost" id="saveshare">Share / save</button>':'')+'</div></div>':'')+
      '<div class="meta"><div><div class="k">Due</div><div class="v">'+esc(o.due||'To be set')+'</div></div><div><div class="k">Order</div><div class="v">'+esc(o.items||'See your quote')+'</div></div></div>'+
      (o.payment_status==='authorized'?'<div class="note" style="margin-top:8px">Card authorized'+(o.payment_amt?' for $'+(+o.payment_amt).toFixed(2):'')+' - charged only when you approve the proof.</div>':'')+
      (o.payment_status==='captured'?'<div class="note" style="margin-top:8px">Paid by card'+(o.payment_amt?' - $'+(+o.payment_amt).toFixed(2):'')+'. Thank you.</div>':'')+
      (o.payment_status==='reauth_sent'||o.payment_status==='capture_failed'?'<a class="btn" href="/cart/?reauth='+encodeURIComponent(o.code)+'&t='+encodeURIComponent(o.token||'')+'" style="display:block;text-align:center;text-decoration:none">Re-authorize your card →</a><div class="note">Card holds last 7 days; one tap puts a fresh hold on so approval can go straight to print.</div>':'')+
      (o.pay_url?'<a class="btn" id="pay" href="'+esc(o.pay_url)+'" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">Pay the invoice →</a><div class="note">Opens your Square invoice. Payment locks in your spot in the queue.</div>':'')+
      (o.can_approve?'<button class="btn" id="approve">✓ Approve my proof</button><div class="note">Approving tells us the proof is right and we can print.</div>':'')+
      (o.can_change?'<button class="btn ghost" id="chg" type="button" style="margin-top:8px">Request changes</button><div id="chgbox" hidden style="margin-top:8px"><textarea id="chgnote" rows="3" maxlength="400" placeholder="What should change? e.g. make the logo bigger, fix the strain name"></textarea><button class="btn" id="chgsend" type="button" style="margin-top:8px">Send change request</button></div>':'')+
      (o.reorder_url?'<a class="btn" href="'+esc(o.reorder_url)+'" style="display:block;text-align:center;text-decoration:none">Reorder this job →</a><div class="note">Opens the app with this order filled in - adjust anything, then send.</div>':'')+
      (o.stage==='complete'?'<div class="rate" id="rate"><div class="k">How did we do?</div>'+(o.rating?'<div class="thanks">'+(String(o.rating).indexOf('up')===0?'Thanks for the thumbs up.':'Thanks for telling us - we are on it.')+'</div>':'<div class="tb"><button type="button" class="tbtn" data-r="up">👍 Great</button><button type="button" class="tbtn" data-r="down">👎 Not this time</button></div><div id="ratebox" hidden><textarea id="ratenote" rows="3" maxlength="400" placeholder="What should we fix? We read every one."></textarea><button class="btn" id="ratesend" type="button" style="margin-top:8px">Send</button></div><small id="ratemsg"></small>')+'</div>':'')+
      '<ul class="tl" style="margin-top:18px">'+tl+'</ul>'+
      (o.token?'<div class="prefs" id="prefs"><span class="pl">Order updates</span>'+
        '<div class="chan"><b>Email</b> <span>'+(o.email?esc(o.email):'none on file')+'</span><small>Every step lands here.</small></div>'+
        '<div class="chan" id="phrow"><b>Phone</b> <span id="phshow">'+(o.phone_last4?'on file &middot; &hellip;'+esc(o.phone_last4):'none on file')+'</span><button type="button" class="lnk" id="phadd">'+(o.phone_last4?'Change':'Add my number')+'</button><small>So we can call or text you about this order. Never shared.</small></div>'+
        '<div class="phbox" id="phbox" hidden><input id="phin" type="tel" inputmode="tel" autocomplete="tel" placeholder="Your cell number"><button type="button" class="btn small" id="phsave">Save</button></div>'+
        '<small id="prefnote"></small>'+
        '<div class="pushrow" id="pushrow" hidden><div class="pt"><b>Updates on this phone</b><small id="pushnote">A notification the moment your order moves.</small></div><button type="button" class="sw" id="pushsw" role="switch" aria-checked="false" aria-label="Push notifications on this phone"></button></div>'+
        '</div>':'');
    var ab=document.getElementById('approve');
    if(ab) ab.addEventListener('click',function(){ ab.disabled=true; ab.textContent='Sending…';
      fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'approve',code:o.code,token:o.token})}).then(function(r){return r.json();})
        .then(function(j){ if(j&&j.ok){ load(); } else { ab.disabled=false; ab.textContent='✓ Approve my proof'; alert('Could not record the approval - try again or text 734 460 3845.'); } })
        .catch(function(){ ab.disabled=false; ab.textContent='✓ Approve my proof'; }); });
    // 2026-09-18 (Shane: 'the QR should be able to be saved as a desktop link for repeated access'): the page has no manifest on purpose,
    // so Add to Home Screen saves THIS exact link (order + token) as an icon - iOS via Share, Android via the browser menu, desktop as a bookmark.
    var sv=document.getElementById('save');
    if(sv){ document.getElementById('savex').addEventListener('click',function(){ try{ localStorage.setItem('st_track_saved_'+o.code,'1'); }catch(e){} sv.remove(); });
      var cp=document.getElementById('savecopy'); cp.addEventListener('click',function(){ var u=location.href.split('#')[0]; (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){ cp.textContent='Copied'; },function(){ prompt('Your order link:',u); }); });
      var sh=document.getElementById('saveshare'); if(sh) sh.addEventListener('click',function(){ navigator.share({title:'My Sticky Trap order '+o.code,url:location.href.split('#')[0]}).catch(function(){}); }); }
    var cb=document.getElementById('chg'), cbox=document.getElementById('chgbox'), cs=document.getElementById('chgsend');
    if(cb) cb.addEventListener('click',function(){ cbox.hidden=!cbox.hidden; if(!cbox.hidden){ document.getElementById('chgnote').focus(); } });
    var pbox=document.getElementById('prefs');
    // 2026-09-18 (Shane: 'no phone on file and the box is not clickable - how can they add it'): texts are off (no Twilio), so the old
    // Email/Text checkboxes are gone. Email is the channel; the customer can add or change a phone so the shop can call or text by hand.
    if(pbox){ var padd=document.getElementById('phadd'), pboxd=document.getElementById('phbox'), pin=document.getElementById('phin'), psave=document.getElementById('phsave'), pnote2=document.getElementById('prefnote'), pshow=document.getElementById('phshow');
      padd.addEventListener('click',function(){ pboxd.hidden=!pboxd.hidden; if(!pboxd.hidden) pin.focus(); });
      pin.addEventListener('input',function(){ var d=pin.value.replace(/\D/g,'').slice(0,11); if(d.length===11&&d[0]==='1') d=d.slice(1); pin.value=d.length>6?d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6):d.length>3?d.slice(0,3)+'-'+d.slice(3):d; });
      psave.addEventListener('click',function(){ var d=pin.value.replace(/\D/g,''); if(d.length<10){ pnote2.textContent='Ten digits, please.'; return; }
        psave.disabled=true; pnote2.textContent='Saving…';
        fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'order_prefs',code:o.code,token:o.token,notify:(o.notify==='both'||o.notify==='sms')?'both':'email',phone:d})}).then(function(r){return r.json();})
          .then(function(j){ psave.disabled=false; if(j&&j.ok){ o.phone_last4=j.phone_last4||d.slice(-4); pshow.innerHTML='on file &middot; &hellip;'+esc(o.phone_last4); padd.textContent='Change'; pboxd.hidden=true; pin.value=''; pnote2.textContent='Saved. We have your number for this order.'; }
            else { pnote2.textContent=j&&j.error==='no_email'?'Add an email first - it is how we reach you.':'Could not save that - try again.'; } })
          .catch(function(){ psave.disabled=false; pnote2.textContent='Could not reach us - try again.'; }); }); }
    // How did we do? (2026-09-15, order_rate): thumbs up posts at once; thumbs down opens a note. ?rate=up|down from the Complete email pre-selects.
    var rateEl=document.getElementById('rate');
    if(rateEl&&!o.rating){ var rmsg=document.getElementById('ratemsg'), rbox=document.getElementById('ratebox');
      function sendRate(r,note){ rmsg.textContent='Sending…'; rateEl.querySelectorAll('.tbtn').forEach(function(b){ b.disabled=true; });
        fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'order_rate',code:o.code,token:o.token,rating:r,note:note||''})}).then(function(x){return x.json();})
          .then(function(j){ if(j&&j.ok){ rateEl.innerHTML='<div class="k">How did we do?</div><div class="thanks">'+(r==='up'?'Thanks for the thumbs up.':'Thanks for telling us - we are on it.')+'</div>'; } else { rmsg.textContent='Could not send that - try again.'; rateEl.querySelectorAll('.tbtn').forEach(function(b){ b.disabled=false; }); } })
          .catch(function(){ rmsg.textContent='Could not reach us - try again.'; rateEl.querySelectorAll('.tbtn').forEach(function(b){ b.disabled=false; }); }); }
      rateEl.querySelectorAll('.tbtn').forEach(function(b){ b.addEventListener('click',function(){ rateEl.querySelectorAll('.tbtn').forEach(function(x){ x.classList.toggle('on',x===b); });
        if(b.dataset.r==='up'){ rbox.hidden=true; sendRate('up',''); } else { rbox.hidden=false; document.getElementById('ratenote').focus(); rmsg.textContent=''; } }); });
      document.getElementById('ratesend').addEventListener('click',function(){ sendRate('down',document.getElementById('ratenote').value.trim()); });
      var pre=q('rate'); if(pre==='up'||pre==='down'){ var pb=rateEl.querySelector('.tbtn[data-r='+pre+']'); if(pb){ pb.click(); rateEl.scrollIntoView({block:'center'}); } } }
    // Push on this phone (2026-09-15): /push.js + Firebase. Hidden where the browser cannot do it; on iPhone it needs the app on the Home Screen.
    var prow=document.getElementById('pushrow'), psw=document.getElementById('pushsw'), pnote=document.getElementById('pushnote');
    function pushUi(s){ if(!prow) return; prow.hidden=false; psw.classList.toggle('on',s==='on'); psw.setAttribute('aria-checked',s==='on'?'true':'false'); psw.disabled=(s==='denied'||s==='unsupported');
      pnote.textContent = s==='on' ? 'On for this phone. Turn off any time.' : s==='install' ? 'On iPhone: tap Share, then "Add to Home Screen", open the app from there and switch this on.' : s==='denied' ? 'Notifications are blocked for this site in your phone settings.' : s==='unsupported' ? 'This browser cannot do notifications - email has you covered.' : 'A notification the moment your order moves.'; }
    if(window.STPush&&prow){ STPush.state().then(function(s){ pushUi(s); if(s==='on') STPush.attach({code:o.code,order_token:o.token,email:o.email||''}); });
      psw.addEventListener('click',function(){ if(psw.disabled) return; psw.disabled=true; pnote.textContent='One moment…';
        STPush.state().then(function(s){ return s==='on' ? STPush.disable() : STPush.enable({code:o.code,order_token:o.token,email:o.email||''}); })
          .then(function(s){ psw.disabled=false; pushUi(s); if(s==='on') pnote.textContent='On. We will ping this phone when '+o.code+' moves.'; })
          .catch(function(){ psw.disabled=false; pushUi('off'); pnote.textContent='Could not switch that on just now - email still covers you.'; }); }); }
    if(cs) cs.addEventListener('click',function(){ var note=document.getElementById('chgnote').value.trim(); if(!note){ alert('Tell us what should change.'); return; } cs.disabled=true; cs.textContent='Sending…';
      fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'changes',code:o.code,token:o.token,note:note})}).then(function(r){return r.json();})
        .then(function(j){ if(j&&j.ok){ load(); } else { cs.disabled=false; cs.textContent='Send change request'; alert('Could not send that - try again or text 734 460 3845.'); } })
        .catch(function(){ cs.disabled=false; cs.textContent='Send change request'; }); });
  }
  // 2026-09-18: the Google hop behind the API occasionally answers with an HTML error page or a 404 instead of JSON (seen: 35 s then a 404).
  // A customer who scanned a QR must never sit on 'Loading' for that - retry up to 3 times (fresh URL each time) before showing the fallback.
  function load(attempt){
    attempt=attempt||1; var o=q('o'), t=q('t'), e=q('e'), p=q('p');
    if(!o&&p){ if(attempt>1){ var el0=document.querySelector('#app .err'); if(el0) el0.textContent='Still looking… (try '+attempt+' of 3)'; }
      fetch(API+'?action=track&p='+encodeURIComponent(p)+'&_='+Date.now()+'&r='+attempt).then(function(r){return r.text();})
        .then(function(txt){ var j=null; try{ j=JSON.parse(txt); }catch(x){}
          if(j&&j.ok&&j.orders) return renderList(j);
          if(j&&j.error==='not_found') return lookupForm('No orders on that number yet. Try the order code + email, or text us.');
          if(j&&j.error==='bad_phone') return lookupForm('That does not look like a phone number - ten digits, please.');
          if(!j&&attempt<3) return setTimeout(function(){ load(attempt+1); },1500);
          lookupForm('Could not look that up right now. Try again in a moment, or text us.'); })
        .catch(function(){ if(attempt<3) return setTimeout(function(){ load(attempt+1); },1500); lookupForm('Could not reach the tracker right now. Try again in a moment.'); });
      return; }
    if(!o||(!t&&!e)) return lookupForm();
    if(attempt>1){ var el=document.querySelector('#app .err'); if(el) el.textContent='Still loading your order… (try '+attempt+' of 3)'; }
    fetch(API+'?action=track&o='+encodeURIComponent(o)+'&t='+encodeURIComponent(t)+'&e='+encodeURIComponent(e)+'&_='+Date.now()+'&r='+attempt).then(function(r){return r.text();})
      .then(function(txt){ var j=null; try{ j=JSON.parse(txt); }catch(x){}
        if(j&&j.ok&&j.order) return render(j.order);
        if(j&&j.error==='not_found') return lookupForm('We could not find that order. Check the code and the email, or text us.');
        if(!j&&attempt<3) return setTimeout(function(){ load(attempt+1); },1500);   // HTML / empty answer = the hop hiccuped, not the order
        lookupForm('Could not load the order right now. Check the code and email, or text us.'); })
      .catch(function(){ if(attempt<3) return setTimeout(function(){ load(attempt+1); },1500); lookupForm('Could not reach the tracker right now. Try again in a moment.'); });
  }
  load();
})();
</script>
</body>
</html>
