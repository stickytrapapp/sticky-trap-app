<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Sticky Trap - Client SKUs</title>
<!-- 10/30 Shane (team ask): like the Pad - every client A-Z, pick one and all their SKUs load. Read-only.
     Data = ../catalog.json (the Pad's catalog, AES-GCM with the staff PIN, rebuilt 5:30 every morning by
     Order Intake\make_catalog_file.py). No customer data in this file. -->
<style>
  :root{--bg:#fff;--line:#e2e2e6;--ink:#111;--muted:#6b6b76;--pink:#C2117E;--soft:#f6f6f8}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:16px 16px 60px}
  h1{font-size:22px;margin:6px 0 2px;letter-spacing:.02em} .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .top a{color:var(--pink);font-size:14px;white-space:nowrap}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;background:#fff;color:var(--ink);border:1px solid #c9c9d1;border-radius:8px;padding:11px 10px;font-size:16px}
  input:focus,select:focus{outline:none;border-color:var(--pink)}
  .btn{display:inline-block;background:var(--pink);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}
  #gate{max-width:360px;margin:80px auto;text-align:center}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .hidden{display:none !important}
  .card{border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin:12px 0;box-shadow:0 1px 2px rgba(17,17,17,.05)}
  .sum{font-size:13px;color:var(--muted);margin:12px 0 0}
  .sum b{color:var(--ink)}
  details{border-bottom:1px solid var(--line)} details:last-child{border-bottom:0}
  summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;padding:12px 0;font-size:15px;font-weight:700}
  summary::-webkit-details-marker{display:none} summary::before{content:'\25B8';color:var(--muted);font-size:13px} details[open] summary::before{content:'\25BE'}
  summary .n{margin-left:auto;font-size:12px;color:var(--pink);font-weight:600}
  .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0 9px 18px;border-top:1px solid var(--line)}
  .nm{font-size:15px;overflow-wrap:anywhere} .pr{font-size:16px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .meta{font-size:12px;color:var(--muted);grid-column:1/3;min-width:0;overflow-wrap:anywhere}
  html,body{overflow-x:hidden} select{max-width:100%}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--ink);margin-right:4px}
  .empty{color:var(--muted);padding:14px 0}
</style></head>
<body>
<div id="gate" class="wrap">
  <h1>Client SKUs</h1><p class="sub">Staff PIN</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" onkeydown="if(event.key==='Enter')unlock()">
  <p class="hint" id="gateMsg"></p><br><button class="btn" onclick="unlock()">Open</button>
</div>

<div id="app" class="wrap hidden">
  <div class="top"><h1>Client SKUs</h1><a href="../">Order Pad &rarr;</a></div>
  <div class="sub" id="note"></div>
  <label for="client">Client</label>
  <select id="client" onchange="pick()"></select>
  <div id="out"></div>
</div>

<script>
var CAT = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function money(x){ if(x == null || x === '') return ''; var c = Math.round(x * 1000) / 1000; return '$' + (Math.abs(c * 100 - Math.round(c * 100)) > 1e-6 ? c.toFixed(3) : c.toFixed(2)); }

// same decrypt as the Pad (order/index.html catalogLoad)
function load(pin){
  return fetch('../catalog.json?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ if(!r.ok) throw new Error('catalog missing'); return r.json(); }).then(function(f){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(f.salt), iterations: 200000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function(key){ return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(f.iv) }, key, b64(f.data)); })
      .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); })
      .catch(function(){ return { ok: false }; });
  });
}

// product group for one SKU - vessel first, else the item name (same columns as the Client Product Grid)
var ORDER = ['Miron 5 ml','Miron 100 ml','Miron 150 ml','Miron 250 ml','Miron 500 ml','Tube 65 mm','Tube 95 mm','Pop Top Tube',
             'o2 Vape','Other Vape','Tip Band','Lighter','Tamper Seal','Slaps / Stickers','Other Jars','Custom / Other','Services'];
var SERVICE = /^(ach|square fee|handling|travel|installation|same-day|update text|brand package|business cards|\d+ additional product mockups)/i;
function group(k){
  var sku = String(k.sku || ''), v = String(k.vessel || '').toLowerCase();
  if(SERVICE.test(sku)) return 'Services';
  if(/tamper/i.test(sku)) return 'Tamper Seal';
  var texts = [v, (v + ' ' + sku).toLowerCase()];
  for(var i = 0; i < texts.length; i++){
    var t = texts[i]; if(!t || (i === 0 && (v === 'custom' || v === ''))) continue;
    var m = t.match(/(\d+)\s*ml\b/);
    if(m && ['5','100','150','250','500'].indexOf(m[1]) >= 0 && t.indexOf('vape') < 0) return 'Miron ' + m[1] + ' ml';
    if(t.indexOf('pop top') >= 0) return 'Pop Top Tube';
    if(/65\s*mm/.test(t)) return 'Tube 65 mm';
    if(/95\s*mm/.test(t)) return 'Tube 95 mm';
    if(/\bo2\b/.test(t)) return 'o2 Vape';
    if(t.indexOf('vape') >= 0) return 'Other Vape';
    if(/\btip\b|cigar band|\bband\b/.test(t)) return 'Tip Band';
    if(/bic|lighter/.test(t)) return 'Lighter';
    if(/slap|sticker|\d"\s*(x|circle|label)/.test(t)) return 'Slaps / Stickers';
    if(/global|uline|glass|puck|jar|2 oz|1 oz/.test(t)) return 'Other Jars';
  }
  return 'Custom / Other';
}
function dkey(d){ var m = String(d || '').match(/(\d+)\/(\d+)\/(\d+)/); return m ? (+m[3]) * 10000 + (+m[1]) * 100 + (+m[2]) : 0; }
function specs(k){
  var t = [];
  if(k.vessel) t.push(k.vessel);
  if(k.material) t.push(k.material);
  if(k.raised === 'Y') t.push('Raised' + (k.gl && k.gl !== '0' ? ' (texture ' + k.gl + ')' : ''));
  else if(k.raised === 'N' || k.raised === 'Flat') t.push('Flat');
  if(k.white_ink === 'Y') t.push('White ink');
  return t.map(function(x){ return '<span class="tag">' + esc(x) + '</span>'; }).join('');
}

function unlock(){
  var pin = $('pin').value.trim(); if(!pin) return;
  $('gateMsg').textContent = 'Loading…';
  load(pin).then(function(r){
    if(!r.ok){ $('gateMsg').textContent = 'Wrong PIN'; return; }
    CAT = r;
    try { localStorage.setItem('st_pin', pin); } catch(e){}
    var names = r.customers.map(function(c){ return c.name; }).sort(function(a, b){ return a.toLowerCase().localeCompare(b.toLowerCase()); });
    $('client').innerHTML = '<option value="">Choose a client…</option>' + names.map(function(n){ return '<option>' + esc(n) + '</option>'; }).join('');
    var built = new Date(r.cached); $('note').textContent = names.length + ' clients · ' + r.skus.length + ' SKUs · from invoice history, updated ' + built.toLocaleDateString();
    $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
    var want = new URLSearchParams(location.search).get('c');
    if(!want){ try { want = localStorage.getItem('st_sku_client'); } catch(e){} }
    if(want && names.indexOf(want) >= 0){ $('client').value = want; pick(); }
  }).catch(function(e){ $('gateMsg').textContent = 'Error: ' + e.message; });
}

function pick(){
  var name = $('client').value, out = $('out');
  if(!name){ out.innerHTML = ''; return; }
  try { localStorage.setItem('st_sku_client', name); } catch(e){}
  var c = CAT.customers.filter(function(x){ return x.name === name; })[0] || {};
  var ks = CAT.skus.filter(function(k){ return k.customer === name; });
  var groups = {};
  ks.forEach(function(k){ (groups[group(k)] = groups[group(k)] || []).push(k); });
  var html = '<p class="sum"><b>' + ks.length + '</b> SKU' + (ks.length === 1 ? '' : 's') +
    (c.last_date ? ' · last order <b>' + esc(c.last_date) + '</b>' : '') + (c.invoices ? ' · ' + c.invoices + ' invoice' + (c.invoices === 1 ? '' : 's') : '') + '</p>';
  if(!ks.length) html += '<div class="card"><div class="empty">No SKUs on file for this client.</div></div>';
  else html += '<div class="card">' + ORDER.filter(function(g){ return groups[g]; }).map(function(g){
    var rows = groups[g].sort(function(a, b){ return dkey(b.last_date) - dkey(a.last_date) || String(a.sku).localeCompare(String(b.sku)); });
    return '<details' + (g === 'Services' ? '' : ' open') + '><summary>' + esc(g) + '<span class="n">' + rows.length + '</span></summary>' +
      rows.map(function(k){
        return '<div class="line"><div class="nm">' + esc(k.sku) + '</div><div class="pr">' + money(k.unit) + '</div>' +
          '<div class="meta">' + specs(k) + ' Last: ' + (k.qty != null ? Number(k.qty).toLocaleString() + ' pcs · ' : '') + esc(k.last_date || '') +
          (k.last_invoice ? ' · ' + esc(k.last_invoice) : '') + (k.times > 1 ? ' · ordered ' + k.times + 'x' : '') + '</div></div>';
      }).join('') + '</details>';
  }).join('') + '</div>';
  out.innerHTML = html;
}

try { var p = localStorage.getItem('st_pin'); if(p){ $('pin').value = p; unlock(); } } catch(e){}
</script>
</body></html>
