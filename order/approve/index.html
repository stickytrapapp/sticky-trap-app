<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sticky Trap - Approve order</title>
<style>
  :root{--bg:#000;--card:#111;--line:#2a2a2a;--ink:#fff;--muted:#9a9a9a;--pink:#FF1FA2;--ok:#2ecc71;--warn:#ffb020}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 90px}
  h1{font-size:22px;margin:6px 0 2px} .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .card h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);margin:0 0 10px}
  pre{white-space:pre-wrap;word-break:break-word;font:14px/1.45 ui-monospace,Consolas,monospace;color:#ddd;margin:0}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;box-sizing:border-box;background:#000;color:#fff;border:1px solid #444;border-radius:10px;padding:12px;font-size:16px}
  .btn{display:block;width:100%;background:var(--pink);color:#fff;border:0;border-radius:12px;padding:15px;font-size:18px;font-weight:700;cursor:pointer;margin-top:12px}
  .btn[disabled]{opacity:.5}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .muted{color:var(--muted);font-size:13px}
  a{color:var(--pink)}
  .hidden{display:none}
</style></head>
<body><div class="wrap">
  <h1>Approve order</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="card" id="pinCard"><h2>Staff PIN</h2><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn" onclick="load()">Open</button></div>
  <div id="body" class="hidden">
    <div class="card"><h2>Order</h2><pre id="qty"></pre></div>
    <div class="card"><h2>Builder notes</h2><pre id="notes"></pre></div>
    <div class="card"><h2>Files</h2><div id="files" class="muted">The invoice and work order PDFs are on the Monday job.</div></div>
    <button class="btn" id="go" onclick="approve()">Approve - send it</button>
    <div id="msg" class="muted" style="margin-top:10px"></div>
  </div>
</div>
<script>
// 9/16: approve an intake order from the phone, from the Monday notification link. Anonymous fetch to the Apps Script
// backend (same as /order/), PIN-gated there. Approved -> Square draft (Square payers) or the ACH/3372 email draft.
var API = 'https://script.google.com/macros/s/AKfycbzqXL9eaqKH7vetYrew5ucl9FskhHqJ5_awHSeM2I0i1LB2v7aUng2mTbDq8aYaZbwbsw/exec';
var ITEM = new URLSearchParams(location.search).get('item') || '';
function $(id){ return document.getElementById(id); }
function api(params){ return fetch(API + '?' + new URLSearchParams(params).toString(), { redirect: 'follow' }).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }
function pin(){ return $('pin').value.trim(); }
function load(){
  if(!ITEM){ $('sub').textContent = 'No order in the link.'; return; }
  $('sub').textContent = 'Loading…';
  api({ action: 'item', pin: pin(), item: ITEM }).then(function(r){
    if(!r.ok){ $('sub').textContent = r.error === 'bad pin' ? 'Wrong PIN' : ('Error: ' + r.error); return; }
    try { localStorage.setItem('st_pin', pin()); } catch(e){}
    $('pinCard').classList.add('hidden'); $('body').classList.remove('hidden');
    $('sub').textContent = r.name + (r.invoice ? ' - ' + r.invoice : '') + ' - status: ' + (r.status || '-') + (r.due ? ' - due ' + r.due : '');
    $('qty').textContent = [r.quantities, r.lines].filter(Boolean).join('\n') || '(no lines)';
    $('notes').textContent = r.builder_note || '(none)';
    if(r.job) $('files').innerHTML = 'Invoice + work order PDFs: <a href="' + r.job + '" target="_blank">open the Monday job</a>';
    if(r.status === 'Approved' || r.status === 'Sent'){ $('go').disabled = true; $('msg').textContent = 'Already ' + r.status.toLowerCase() + '.'; }
    if(r.status === 'Needs info'){ $('go').disabled = true; $('msg').innerHTML = '<span class="warn">Needs info first - fix it on the intake item, the builder retries within 10 minutes.</span>'; }
  }).catch(function(e){ $('sub').textContent = 'Error: ' + e.message; });
}
function approve(){
  $('go').disabled = true; $('msg').textContent = 'Approving…';
  api({ action: 'approve', pin: pin(), item: ITEM }).then(function(r){
    if(!r.ok){ $('go').disabled = false; $('msg').innerHTML = '<span class="warn">' + (r.error || 'failed') + '</span>'; return; }
    $('msg').innerHTML = '<span class="ok">Approved.</span> Square payers: the draft appears in Square within 15 minutes. ACH / check: the email draft lands in thestickytrap@ Drafts within 15 minutes.';
  }).catch(function(e){ $('go').disabled = false; $('msg').innerHTML = '<span class="warn">Error: ' + e.message + '</span>'; });
}
try { var p = localStorage.getItem('st_pin'); if(p){ $('pin').value = p; load(); } else { $('sub').textContent = 'Enter the staff PIN.'; } } catch(e){ $('sub').textContent = 'Enter the staff PIN.'; }
</script>
</body></html>
