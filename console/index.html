<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0A0F">
<title>Order Console · The Sticky Trap</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root{--ink:#0A0A0F;--panel:#131019;--panel-2:#1b1726;--line:#2a2438;--paper:#F5F3FA;--muted:#b3adc6;--mag:#FF1FA2;--pur:#8A2BE2;--cy:#12C4FF;--good:#25E0A6;--warn:#EAB84B;--grad:linear-gradient(100deg,#FF1FA2 0%,#8A2BE2 52%,#12C4FF 100%)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 70px}
  h1{font-size:18px;font-weight:900;margin:0;display:flex;align-items:center;justify-content:space-between}
  h1 small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 14px}
  input,select,textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:#fff;font:inherit;font-size:15px;padding:10px 11px;outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--cy)}
  .btn{background:var(--grad);color:#0A0A0F;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-size:14px;font-weight:900;cursor:pointer}
  .btn.ghost{background:rgba(255,255,255,.06);color:var(--paper);border:1px solid var(--line)}
  .btn[disabled]{opacity:.5}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1;min-width:120px}
  .o{border-left:4px solid var(--line)}
  .o.stale{border-left-color:var(--warn)}
  .o .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .o b{font-size:16px}
  .o .who{color:var(--muted);font-size:13px}
  .o .items{font-size:12.5px;color:var(--paper);opacity:.85;margin:6px 0}
  .badge{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(18,196,255,.14);color:var(--cy);white-space:nowrap}
  .badge.stale{background:rgba(234,184,75,.15);color:var(--warn)}
  .age{font-size:11.5px;color:var(--muted)}
  .stages{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .stages button{flex:1;min-width:96px;font:inherit;font-size:12.5px;font-weight:800;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--paper);cursor:pointer}
  .stages button.hot{background:var(--grad);color:#0A0A0F;border-color:transparent}
  .more{display:flex;gap:6px;margin-top:8px}
  .more select{flex:1}
  .note{margin-top:8px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;color:#0A0A0F;font-weight:800;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:14px 0 6px}
  .hidden{display:none}
  details summary{cursor:pointer;font-weight:800;color:var(--cy);font-size:13px;list-style:none}
  details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Order Console <small>staff</small></h1>
  <div class="sub">Tap a stage to log it - the client gets the email, Monday follows.</div>

  <div class="card" id="gate">
    <div class="k">Console PIN</div>
    <div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn" id="go">Open</button></div>
  </div>

  <div id="main" class="hidden">
    <details class="card"><summary>+ Add an order that didn't come through the app</summary>
      <div class="k">Order</div>
      <div class="row"><input id="nCode" placeholder="Code (blank = auto ST-XXXX)"><input id="nDue" placeholder="Due (e.g. Sep 19)"></div>
      <div class="k">Client</div>
      <div class="row"><input id="nName" placeholder="Contact name"><input id="nCompany" placeholder="Company"></div>
      <div class="row" style="margin-top:8px"><input id="nEmail" type="email" placeholder="Email (gets the updates)"><input id="nPhone" type="tel" placeholder="Phone"></div>
      <div class="k">What we're making</div>
      <textarea id="nItems" rows="2" placeholder="e.g. 500 3&quot; slaps holo Pro · 250 Miron 250 lids+wraps"></textarea>
      <div class="row" style="margin-top:10px"><select id="nStage"></select><button class="btn" id="nAdd">Add order</button></div>
    </details>
    <div class="k" id="listHead">Open orders</div>
    <div id="list"><div class="sub">Loading…</div></div>
    <button class="btn ghost" id="refresh" style="width:100%">Refresh</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var API='https://script.google.com/macros/s/AKfycbzgctrnkyWjVnhzioE_B4x8J2pyi4WzRSJG2e00Y_Y5cz0vQx-q5jhvOhMWg2x-K9ciFw/exec';
  var STAGES=[['received','Request received'],['quoted','Quote sent'],['deposit','Deposit received'],['proofing','Art & proof in progress'],['proof_sent','Proof sent'],['approved','Proof approved'],['printing','Printing'],['ready','Ready for pickup'],['shipped','Shipped'],['complete','Complete']];
  var HOT={proof_sent:'Proof sent',printing:'Printing',ready:'Ready',shipped:'Shipped',complete:'Complete'};
  var NUDGE={proof_sent:24,printing:72};
  var $=function(id){return document.getElementById(id);}; var PIN='';
  var ONLY=(location.search.match(/[?&]o=([^&]*)/)||[])[1]; ONLY=ONLY?decodeURIComponent(ONLY).toUpperCase():'';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){t.classList.remove('on');},1800); }
  function post(body){ body.pin=PIN; return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json();}); }
  function label(k){ var s=STAGES.filter(function(x){return x[0]===k;})[0]; return s?s[1]:k; }
  function age(ts){ var h=Math.max(0,(Date.now()-new Date(ts).getTime())/36e5); return h<1?'just now':h<48?Math.round(h)+'h':Math.round(h/24)+'d'; }
  STAGES.forEach(function(s){ var o=document.createElement('option'); o.value=s[0]; o.textContent=s[1]; $('nStage').appendChild(o); }); $('nStage').value='deposit';
  try{ PIN=localStorage.getItem('st_console_pin')||''; }catch(e){}
  function open(){ $('gate').classList.add('hidden'); $('main').classList.remove('hidden'); load(); }
  $('go').addEventListener('click',function(){ PIN=$('pin').value.trim(); if(!PIN) return; try{localStorage.setItem('st_console_pin',PIN);}catch(e){} open(); });
  $('pin').addEventListener('keydown',function(e){ if(e.key==='Enter') $('go').click(); });
  if(PIN) open();
  function load(){
    $('list').innerHTML='<div class="sub">Loading…</div>';
    fetch(API+'?action=orders&pin='+encodeURIComponent(PIN)+'&_='+Date.now()).then(function(r){return r.json();}).then(function(j){
      if(!j||!j.ok){ if(j&&j.error==='bad_pin'){ try{localStorage.removeItem('st_console_pin');}catch(e){} $('gate').classList.remove('hidden'); $('main').classList.add('hidden'); toast('Wrong PIN'); return; } $('list').innerHTML='<div class="sub">Could not load orders.</div>'; return; }
      if(ONLY){ j.orders=j.orders.filter(function(o){ return String(o.code).toUpperCase()===ONLY; }); }
      $('listHead').innerHTML= ONLY ? ('Order '+esc(ONLY)+' · <a href="/console/" style="color:var(--cy);font-weight:800;text-decoration:none">all orders</a>') : ('Open orders · '+j.orders.length);
      if(!j.orders.length){ $('list').innerHTML='<div class="card sub">No open orders. Add one above, or they arrive from the app\'s quote form.</div>'; return; }
      $('list').innerHTML=j.orders.map(function(o){
        var hrs=(Date.now()-new Date(o.stage_ts).getTime())/36e5, stale=NUDGE[o.stage]&&hrs>NUDGE[o.stage];
        var hot=Object.keys(HOT).map(function(k){ return '<button data-c="'+esc(o.code)+'" data-s="'+k+'" class="'+(k===o.stage?'hot':'')+'">'+HOT[k]+'</button>'; }).join('');
        var more='<select data-c="'+esc(o.code)+'" class="stsel"><option value="">Other stage…</option>'+STAGES.map(function(s){return '<option value="'+s[0]+'">'+s[1]+'</option>';}).join('')+'</select>';
        return '<div class="card o'+(stale?' stale':'')+'" data-code="'+esc(o.code)+'"><div class="top"><div><b>'+esc(o.code)+'</b> <span class="who">'+esc(o.company||o.name||'')+(o.due?' · due '+esc(o.due):'')+'</span></div><span class="badge'+(stale?' stale':'')+'">'+esc(label(o.stage))+'</span></div>'+
          '<div class="items">'+esc(o.items||'')+'</div><div class="age">'+esc(o.email||'no email on file')+' · in this stage '+age(o.stage_ts)+(stale?' · OVERDUE':'')+'</div>'+
          '<div class="stages">'+hot+'</div><div class="more">'+more+'<input class="stnote" data-c="'+esc(o.code)+'" placeholder="Note to client (optional)"></div>'+
          '<div class="more"><a class="btn ghost" style="flex:1;text-align:center;text-decoration:none;font-size:12.5px" href="/track/?o='+encodeURIComponent(o.code)+'&e='+encodeURIComponent(o.email||'')+'" target="_blank" rel="noopener">Client view ↗</a>'+(ONLY?'':'<a class="btn ghost" style="flex:1;text-align:center;text-decoration:none;font-size:12.5px" href="/console/?o='+encodeURIComponent(o.code)+'">Just this order</a>')+'</div></div>';
      }).join('');
      $('list').querySelectorAll('.stages button').forEach(function(b){ b.addEventListener('click',function(){ setStage(b.dataset.c,b.dataset.s,b); }); });
      $('list').querySelectorAll('.stsel').forEach(function(s){ s.addEventListener('change',function(){ if(s.value) setStage(s.dataset.c,s.value,s); }); });
    }).catch(function(){ if(!load._retried){ load._retried=true; setTimeout(load,2500); return; } load._retried=false; $('list').innerHTML='<div class="sub">Could not reach the backend - tap Refresh.</div>'; });
  }
  function setStage(code,stage,el){ var card=el.closest('.card'), note=(card.querySelector('.stnote')||{}).value||''; el.disabled=true;
    post({action:'order_stage',code:code,stage:stage,note:note}).then(function(j){ if(j&&j.ok){ toast(code+' → '+label(stage)+(j.emailed?' · client emailed':'')); load(); } else { el.disabled=false; toast('Failed: '+((j&&j.error)||'')); } }).catch(function(){ el.disabled=false; toast('Network error'); }); }
  $('nAdd').addEventListener('click',function(){ var b=$('nAdd'); b.disabled=true;
    post({action:'order_new',code:$('nCode').value.trim(),name:$('nName').value.trim(),company:$('nCompany').value.trim(),email:$('nEmail').value.trim(),phone:$('nPhone').value.trim(),items:$('nItems').value.trim(),due:$('nDue').value.trim(),stage:$('nStage').value,source:'console'})
      .then(function(j){ b.disabled=false; if(j&&j.ok){ toast('Added '+j.code); ['nCode','nName','nCompany','nEmail','nPhone','nItems','nDue'].forEach(function(id){$(id).value='';}); load(); } else toast('Failed: '+((j&&j.error)||'')); }).catch(function(){ b.disabled=false; toast('Network error'); }); });
  $('refresh').addEventListener('click',load);
})();
</script>
</body>
</html>
